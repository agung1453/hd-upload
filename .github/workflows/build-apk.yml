
name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also build the release APK"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: nimbus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx3072m
        -XX:MaxMetaspaceSize=1024m
        -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Ensure wrapper is executable
        run: chmod +x ./gradlew

      - name: Restore release keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ] &&
             [ -n "$KEYSTORE_PASSWORD" ] &&
             [ -n "$KEY_ALIAS" ] &&
             [ -n "$KEY_PASSWORD" ]; then

            KEYSTORE_PATH="$RUNNER_TEMP/nimbus-release.jks"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"

            {
              echo "NIMBUS_STORE_FILE=$KEYSTORE_PATH"
              echo "NIMBUS_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NIMBUS_KEY_ALIAS=$KEY_ALIAS"
              echo "NIMBUS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"

            echo "Release signing secrets found."
          else
            echo "No release keystore configured."
            echo "Release build requires compatible Gradle signing configuration."
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode=summary assembleDebug

      - name: Build release APK
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.release_build == true
        run: ./gradlew --no-daemon --stacktrace --warning-mode=summary assembleRelease

      - name: Collect APKs and checksums
        run: |
          set -euo pipefail

          mkdir -p dist

          find app/build/outputs/apk -type f -name "*.apk" \
            -exec cp {} dist/ \;

          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "No APK files were generated."
            exit 1
          fi

          cd dist
          sha256sum *.apk > SHA256SUMS.txt

          echo "Generated artifacts:"
          ls -lh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.release_build == true
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-release-apk
          path: |
            dist/*-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Nimbus Browser build"
            echo ""
            echo "- Debug APK: automatically debug-signed by Android Gradle Plugin."
            echo "- Release APK: depends on Gradle release signing configuration."
            echo "- Download APKs from the Actions run Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nimbus-*-apk
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true
