name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also build the release APK"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: nimbus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    # Pinned: ubuntu-latest switches to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      # JDK 17 is what AGP 8.7.x / Gradle 8.9 require. The runner image also
      # ships its own JDK, but pinning Temurin 17 keeps the build reproducible.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Installs nothing globally: it just makes the checked-in Gradle wrapper
      # work and caches ~/.gradle between runs.
      - name: Set up Gradle wrapper (cached)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Ensure wrapper is executable
        run: chmod +x ./gradlew

      # Fast pre-flight that catches the whole class of resource-linking errors
      # Gradle would otherwise report only after a full sync, e.g.
      # "attribute indicatorDirection not found". Purely advisory: the build
      # below is authoritative, so a flaky download can never fail the job.
      - name: Pre-flight resource reference check
        continue-on-error: true
        run: |
          set +e
          FAILED=0
          for script in tools/validate_project.py tools/check_xml_attributes.py; do
            if [ ! -f "$script" ]; then
              echo "::warning::$script is not present in this checkout - skipping"
              continue
            fi
            echo "--- $script"
            python3 "$script"
            rc=$?
            echo "--- $script exited $rc"
            [ "$rc" -ne 0 ] && FAILED=1
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "::warning::A pre-flight check reported problems. The Gradle build below is authoritative."
          fi
          exit 0

      # The release APK must be signed or Android refuses to install it, so a
      # key is always available:
      #
      #   * repository Secrets present -> use them. The signature is STABLE, so
      #     a new build can upgrade an already-installed copy in place.
      #   * otherwise -> mint a throwaway key here, purely so the APK is
      #     installable. It lives only in $RUNNER_TEMP and dies with the job,
      #     so its password protects nothing and every build is signed with a
      #     different key (an upgrade then requires an uninstall first).
      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/nimbus-release.jks"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            SIGNING_SOURCE="repository secrets (STABLE signature - upgrades in place)"
            echo "::notice title=Signing::Using repository secrets; signature is stable."
          else
            # No secrets configured, or this is a fork. Mint an ephemeral key.
            # PKCS12 cannot hold a separate key password, so both are the same.
            KEYSTORE_PASSWORD="nimbus"
            KEY_ALIAS="nimbus"
            KEY_PASSWORD="nimbus"
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Nimbus Browser, OU=Build, O=Nimbus, C=US" \
              -noprompt
            SIGNING_SOURCE="ephemeral key generated for this run (NOT stable - uninstall before upgrading)"
            echo "::notice title=Signing::No secrets found; generated a throwaway key so the APK is installable."
          fi

          chmod 600 "$KEYSTORE_PATH"
          {
            echo "NIMBUS_STORE_FILE=$KEYSTORE_PATH"
            echo "NIMBUS_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "NIMBUS_KEY_ALIAS=$KEY_ALIAS"
            echo "NIMBUS_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          {
            echo "### Signing"
            echo ""
            echo "- Source: $SIGNING_SOURCE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build APKs
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace --warning-mode=summary \
            assembleDebug assembleRelease 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::error::Gradle exited $rc. Relevant lines:"
            grep -nE "^e: |^w: .*(deprecat|error)|error:|ERROR:|FAILURE:|What went wrong|^Caused by:|Execution failed|AAPT|Could not (resolve|find|download)" build.log | head -60
            echo "----- last 40 lines of build.log -----"
            tail -40 build.log
          fi
          exit "$rc"

      - name: Collect APKs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "--- artifacts ---"
          ls -la dist

      # A silently unsigned APK would still upload fine and only fail on the
      # user's phone, so prove the signature before shipping it.
      - name: Verify release APK is signed
        run: |
          set -euo pipefail
          APK="dist/app-release.apk"
          test -f "$APK" || { echo "::error::release APK missing"; exit 1; }

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -1 "$SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK" | head -5
            echo "apksigner verify: OK"
          elif unzip -l "$APK" | grep -qE 'META-INF/.+\.(RSA|DSA|EC)'; then
            echo "v1 (JAR) signature block present: OK"
          else
            echo "::error::release APK carries no signature and cannot be installed"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: nimbus-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: nimbus-release-apk
          path: |
            dist/*-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Nimbus Browser build"
            echo ""
            echo "| Artifact | Notes |"
            echo "| --- | --- |"
            echo "| \`nimbus-debug-apk\` | Debuggable build (applicationId suffix \`.debug\`) |"
            echo "| \`nimbus-release-apk\` | R8-minified + resource-shrunk build |"
            echo ""
            echo "Download them from this run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing needs `contents: write`, which is a *job*-level setting. Keeping
  # it in its own job means the build above stays on `contents: read`, and the
  # write token is never handed to the build steps.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Pinned: ubuntu-latest switches to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v7
        with:
          name: nimbus-release-apk
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true