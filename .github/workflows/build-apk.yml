name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Also build the release APK"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: nimbus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug + release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # JDK 17 is what AGP 8.7.x / Gradle 8.9 require. The runner image also
      # ships its own JDK, but pinning Temurin 17 keeps the build reproducible.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installs nothing globally: it just makes the checked-in Gradle wrapper
      # work and caches ~/.gradle between runs.
      - name: Set up Gradle wrapper (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Ensure wrapper is executable
        run: chmod +x ./gradlew

      # Fast pre-flight that catches the whole class of resource-linking errors
      # Gradle would otherwise report only after a full sync, e.g.
      # "attribute indicatorDirection not found". Purely advisory: the build
      # below is authoritative, so a flaky download can never fail the job.
      - name: Pre-flight resource reference check
        continue-on-error: true
        run: |
          python3 tools/validate_project.py
          python3 tools/check_xml_attributes.py

      # Release signing material comes only from repository Secrets. Nothing is
      # committed. On forks (where secrets are empty) this step is a no-op and
      # the release build simply produces an unsigned APK.
      - name: Restore release keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] \
             && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/nimbus-release.jks"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "NIMBUS_STORE_FILE=$KEYSTORE_PATH"
              echo "NIMBUS_STORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NIMBUS_KEY_ALIAS=$KEY_ALIAS"
              echo "NIMBUS_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "::notice title=Signing::Release signing enabled from repository secrets."
          else
            echo "::notice title=Signing::No keystore secrets found (normal for forks) - release APK will be unsigned."
          fi

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace --warning-mode=summary assembleDebug assembleRelease

      - name: Collect APKs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk -name "*.apk" -exec cp {} dist/ \;
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "--- artifacts ---"
          ls -la dist

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-release-apk
          path: |
            dist/*-release.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Nimbus Browser build"
            echo ""
            echo "| Artifact | Notes |"
            echo "| --- | --- |"
            echo "| \`nimbus-debug-apk\` | Debuggable build (applicationId suffix \`.debug\`) |"
            echo "| \`nimbus-release-apk\` | R8-minified + resource-shrunk build |"
            echo ""
            echo "Download them from this run's **Artifacts** section."
          } >> "$GITHUB_STEP_SUMMARY"

  # Publishing needs `contents: write`, which is a *job*-level setting. Keeping
  # it in its own job means the build above stays on `contents: read`, and the
  # write token is never handed to the build steps.
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: nimbus-release-apk
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: false
          generate_release_notes: true