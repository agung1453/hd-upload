# JVM settings for the Gradle daemon. 2 GB is enough for AGP 8.x + R8 on CI.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Speed
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true