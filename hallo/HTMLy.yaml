name: htmly_app
services:
  htmly_app:
    cpu_shares: 90
    command:
      - /bin/sh
      - -c
      - >
        echo "=== Memeriksa Direktori Proyek PHP ==="

        if [ -f "composer.json" ]; then
          echo "Ditemukan composer.json! Menyiapkan environment..."
          # Menggunakan apk karena kita memakai versi Alpine
          apk add --no-cache git unzip curl
          
          if ! command -v composer > /dev/null; then
            echo "Menginstall Composer..."
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          fi
          
          echo "Menginstall dependencies..."
          composer install --no-interaction
        else
          echo "INFO: composer.json tidak ditemukan."
        fi


        echo "Menjalankan PHP Built-in Web Server..."

        # Mencari folder 'public' (standar Laravel/CodeIgniter 4)

        if [ -d "public" ]; then
          echo "Folder 'public' ditemukan. Server berjalan di port 8000..."
          php -S 0.0.0.0:8000 -t public/
        else
          echo "Server berjalan dari root folder di port 8000..."
          php -S 0.0.0.0:8000
        fi
    container_name: htmly_app
    deploy:
      resources:
        limits:
          memory: 512M
    hostname: htmly_app
    image: php:8.2-alpine
    labels:
      icon: https://www.php.net/images/logos/new-php-logo.svg
    ports:
      - target: 8000
        published: "8012"
        protocol: tcp
    restart: unless-stopped
    user: root
    volumes:
      - type: bind
        source: /DATA/USB/App/htmly-3.1.1
        target: /usr/src/app
    working_dir: /usr/src/app
    devices: []
    cap_add: []
    environment: []
    network_mode: bridge
    privileged: false
x-casaos:
  author: self
  category: Web
  hostname: ""
  icon: https://www.php.net/images/logos/new-php-logo.svg
  index: /
  is_uncontrolled: false
  port_map: "8012"
  scheme: http
  store_app_id: htmly_app
  title:
    custom: ""
    en_us: HTMLy
